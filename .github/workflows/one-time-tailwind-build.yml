name: One-time Tailwind CSS build

on:
  push:
    branches:
      - feat/free-model-resilience-and-playground-polish

permissions:
  contents: write

concurrency:
  group: one-time-tailwind-build
  cancel-in-progress: false

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build local Tailwind stylesheet
        working-directory: plugins/cli-playground/go
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i web/tailwind.input.css -o web/tailwind.css --minify
      - name: Commit generated stylesheet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/cli-playground/go/web/tailwind.css
          if git diff --cached --quiet; then
            echo "Generated stylesheet is unchanged."
          else
            git commit -m "build: compile local Tailwind stylesheet"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
