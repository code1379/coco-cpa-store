PATCH

          python3 <<'PY'
          from pathlib import Path

          readme = Path('plugins/freetier2api/README.md')
          text = readme.read_text()
          marker = '- `0004-preserve-store-management-namespace.patch`: keep management routes and the console under the installed `freetier2api` ID. The `freetier` credential provider and state directory stay compatible with existing accounts.'
          bullet = '- `0005-zcode-marketing-fallback-for-held-plans.patch`: query the marketing channel when every billing offer is already held, and keep fallback query failures visible instead of falsely reporting that all plans were claimed.'
          if bullet not in text:
              if marker not in text: raise SystemExit('README patch insertion point missing')
              readme.write_text(text.replace(marker, marker + '\n' + bullet, 1))

          patch_readme = Path('plugins/freetier2api/patches/README.md')
          text = patch_readme.read_text()
          bullet = '- `0005-zcode-marketing-fallback-for-held-plans.patch`: query marketing when billing offers contain no unheld plan; preserve the fallback error when no claimable offer can be confirmed.'
          if bullet not in text: patch_readme.write_text(text.rstrip() + '\n' + bullet + '\n')

          changelog = Path('plugins/freetier2api/CHANGELOG.md')
          text = changelog.read_text()
          heading = '## 0.1.48-store.1'
          note = '- Fix ZCode offer detection when billing offers are already held; query the marketing fallback and keep lookup failures visible.'
          if heading not in text: raise SystemExit('Missing generated 0.1.48-store.1 changelog entry')
          if note not in text: changelog.write_text(text.replace(heading, heading + '\n\n' + note, 1))
          PY

          # Format generated edits and validate the whole tree before committing.
          nix fmt

          git add nix/packages/plugins/default.nix plugins/freetier2api/go/main.go plugins/freetier2api/README.md plugins/freetier2api/plugin.json plugins/freetier2api/CHANGELOG.md plugins/freetier2api/patches/README.md plugins/freetier2api/patches/0005-zcode-marketing-fallback-for-held-plans.patch README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(freetier2api): upgrade pinned source to $tag"
          else
            echo "The pinned FreeTier2API source is already current; no commit is needed."
          fi

          git push origin "$branch"

          body="$(cat <<EOF
          ## Upgrade
          - Upstream release: [$tag](https://github.com/$repo/releases/tag/$tag)
          - Source commit: $revision
          - Fixed Nix source hash: $hash

          ## Local changes preserved
